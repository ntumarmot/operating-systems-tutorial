<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OS Review｜作業系統互動複習</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // 在畫面繪製前先套用主題，避免閃爍
    (function () {
      try {
        var t = localStorage.getItem('os_theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="app">
    <div class="overlay" id="overlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="#/" class="brand">
          <span class="brand-mark">OS</span>
          <span class="brand-text">OS Review</span>
        </a>
        <button class="icon-btn sidebar-close" id="sidebar-close" aria-label="關閉選單">✕</button>
      </div>

      <div class="sidebar-progress">
        <div class="sidebar-progress-label">
          <span>整體進度</span>
          <span id="sidebar-progress-pct">0%</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="sidebar-progress-fill" style="width:0%"></div></div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <div class="nav-section-title">總覽</div>
        <a class="nav-item" href="#/" data-route="dashboard"><span class="nav-icon">◫</span>Dashboard</a>
        <a class="nav-item" href="#/trace" data-route="trace"><span class="nav-icon">⧉</span>OS Trace Mode</a>
        <a class="nav-item" href="#/interview" data-route="interview"><span class="nav-icon">🎓</span>Interview Mode</a>
        <a class="nav-item" href="#/quiz" data-route="quiz"><span class="nav-icon">✓</span>綜合測驗</a>
        <a class="nav-item" href="#/wrong" data-route="wrong"><span class="nav-icon">✎</span>錯題本 <span class="nav-badge" id="nav-wrong-count"></span></a>
        <div class="nav-section-title">章節</div>
        <div id="nav-chapters"></div>
      </nav>

      <div class="sidebar-footer">
        <button class="theme-toggle" id="theme-toggle">
          <span class="theme-icon" id="theme-icon">☾</span>
          <span id="theme-label">深色模式</span>
        </button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="開啟選單">☰</button>
        <div class="topbar-crumb" id="topbar-crumb">Dashboard</div>
        <div class="topbar-right">
          <a href="#/trace" class="btn btn-ghost btn-sm">⧉ Trace</a>
          <a href="#/interview" class="btn btn-ghost btn-sm">🎓 Interview</a>
        </div>
      </header>
      <div class="chapter-progress" id="chapter-progress" hidden>
        <div class="progress-bar slim"><div class="progress-fill" id="chapter-progress-fill" style="width:0%"></div></div>
      </div>
      <main class="content" id="content"></main>
    </div>
  </div>

  <!-- 第三方（本機，離線可用） -->
  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/katex/auto-render.min.js"></script>

  <!-- 核心工具 -->
  <script src="js/util.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/quiz.js"></script>

  <!-- 純演算法引擎（不碰 DOM，可獨立測試） -->
  <script src="js/engines/sched.js"></script>
  <script src="js/engines/memory.js"></script>
  <script src="js/engines/banker.js"></script>
  <script src="js/engines/disk.js"></script>

  <!-- 互動模擬 -->
  <script src="js/sims/basics.js"></script>
  <script src="js/sims/process.js"></script>
  <script src="js/sims/scheduling.js"></script>
  <script src="js/sims/sync.js"></script>
  <script src="js/sims/semaphore.js"></script>
  <script src="js/sims/deadlock.js"></script>
  <script src="js/sims/memory.js"></script>
  <script src="js/sims/vm.js"></script>
  <script src="js/sims/fsio.js"></script>

  <!-- 章節內容 -->
  <script src="js/content/ch00.js"></script>
  <script src="js/content/ch01.js"></script>
  <script src="js/content/ch02.js"></script>
  <script src="js/content/ch03.js"></script>
  <script src="js/content/ch04.js"></script>
  <script src="js/content/ch05.js"></script>
  <script src="js/content/ch06.js"></script>
  <script src="js/content/ch07.js"></script>
  <script src="js/content/ch08.js"></script>
  <script src="js/content/ch09.js"></script>
  <script src="js/content/interview.js"></script>
  <script src="js/content/trace.js"></script>

  <!-- 頁面 -->
  <script src="js/interview.js"></script>
  <script src="js/trace.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
